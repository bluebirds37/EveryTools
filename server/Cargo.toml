[package]
name = "toolbox-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.27"
dotenvy = "0.15.7"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
kamadak-exif = "0.6.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "limit", "trace", "timeout", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
lopdf = "0.45.0"
